<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA Language Playground</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; text-align: center; }
        p { color: #94a3b8; margin-top: 0; text-align: center; }
        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0284c7; }
        .output-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #4ade80;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>VEXA Language Playground</h1>
    <p>جرب كتابة وتجربة كود لغة VEXA مباشرة عبر المتصفح</p>
    
    <div class="container">
        <textarea id="code-input">var x = 15
var y = 25
print(x + y)
print("مرحباً بك في موقع لغة VEXA!")</textarea>
        <button onclick="runCode()">تشغيل الكود (Run)</button>
        <h3>النتيجة (Output):</h3>
        <div id="output" class="output-box">اضغط على زر التشغيل لرؤية النتيجة...</div>
    </div>

    <script>
        async function runCode() {
            const code = document.getElementById('code-input').value;
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = "جاري التنفيذ...";

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                outputDiv.textContent = data.output || "لا توجد مخرجات.";
            } catch (err) {
                outputDiv.textContent = "خطأ في الاتصال بالخادم: " + err;
            }
        }
    </script>
</body>
</html>
